<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평가 보고서 편집</title>
<style>
/* Clinical-technical identity to match MedPen; document editor on paper. */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --surface-2:#f1f4f7; --line:#dde3e9;
  --fg:#141b22; --muted:#566573; --faint:#8a97a4;
  --accent:#0b7c8b; --accent-weak:#d9edf0; --accent-ink:#064e57;
  --ok:#2f8f4e; --crit:#c0392b;
  --paper:#ffffff; --paper-fg:#1a1a1a;
  --f-head:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1015; --surface:#111a21; --surface-2:#16222b; --line:#243139;
  --fg:#e9eff3; --muted:#93a3af; --faint:#5f6f7c;
  --accent:#2bb6c6; --accent-weak:#10323a; --accent-ink:#8fe3ec;
  --ok:#4bbf6e; --crit:#e5604f;
  --paper:#f7f8f9; --paper-fg:#1a1a1a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1015; --surface:#111a21; --surface-2:#16222b; --line:#243139;
  --fg:#e9eff3; --muted:#93a3af; --faint:#5f6f7c;
  --accent:#2bb6c6; --accent-weak:#10323a; --accent-ink:#8fe3ec;
  --ok:#4bbf6e; --crit:#e5604f;
  --paper:#f7f8f9; --paper-fg:#1a1a1a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-head);font-weight:700;font-size:1rem}
.brand .mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff}
.sp{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:8px 13px;cursor:pointer;font-family:var(--f-body);font-size:.84rem;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.ghost{background:none;color:var(--muted)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}

/* formatting toolbar */
.fmt{max-width:1000px;margin:0 auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.fmt button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:5px;padding:5px 10px;cursor:pointer;font-family:var(--f-body);font-size:.8rem;min-width:34px}
.fmt button:hover{border-color:var(--accent);color:var(--accent)}
.fmt .div{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.fmt .hint{color:var(--faint);font-size:.76rem;margin-left:auto}

/* editor paper */
.stage{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.statusline{color:var(--muted);font-size:.82rem;margin:0 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.paper{background:var(--paper);color:var(--paper-fg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);padding:clamp(22px,5vw,56px);min-height:60vh;max-width:820px;margin:0 auto}
.paper:focus{outline:2px solid var(--accent);outline-offset:3px}
/* document typography (editor + print share these shapes) */
.paper h1{font-family:var(--f-head);font-size:1.6rem;margin:0 0 .5rem;color:#0a3d44;border-bottom:2px solid #0b7c8b;padding-bottom:8px}
.paper h2{font-family:var(--f-head);font-size:1.2rem;margin:1.4rem 0 .5rem;color:#0b7c8b;border-bottom:1px solid #cdd7db;padding-bottom:4px}
.paper h3{font-family:var(--f-head);font-size:1.02rem;margin:1rem 0 .3rem;color:#17323a}
.paper p{margin:0 0 .5rem}
.paper p.meta{color:#555;font-size:.9rem;margin:0 0 .25rem}
.paper p.why{color:#555;margin:0 0 .4rem}
.paper p.sig{margin-top:2rem;color:#333;font-size:.92rem}
.paper ul{margin:0 0 .7rem;padding-left:1.3rem}
.paper li{margin:0 0 .4rem}
.paper code{font-family:var(--f-mono);background:#f1f3f4;color:#0a3d44;padding:1px 5px;border-radius:4px;font-size:.84em}
.paper a{color:#0b7c8b}

.empty{max-width:560px;margin:8vh auto;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:30px}
.empty h2{font-family:var(--f-head);color:var(--fg);margin:0 0 8px}
.empty a{color:var(--accent);font-weight:600}
@media print{.topbar,.fmt,.statusline{display:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="in">
    <div class="brand"><span class="mk">⊕</span> 평가 보고서 편집</div>
    <div class="sp"></div>
    <button class="btn ghost" id="homeBtn" type="button">← 빌더로</button>
    <button class="btn ghost" id="themeBtn" type="button">◐ 테마</button>
    <button class="btn" id="docxBtn" type="button">⬇ DOCX</button>
    <button class="btn pri" id="pdfBtn" type="button">⬇ PDF</button>
  </div>
  <div class="fmt" id="fmtBar">
    <button type="button" data-cmd="formatBlock" data-val="h2" title="제목">H2</button>
    <button type="button" data-cmd="formatBlock" data-val="h3" title="소제목">H3</button>
    <button type="button" data-cmd="formatBlock" data-val="p" title="본문">¶</button>
    <span class="div"></span>
    <button type="button" data-cmd="bold" title="굵게"><b>B</b></button>
    <button type="button" data-cmd="italic" title="기울임"><i>I</i></button>
    <button type="button" data-cmd="insertUnorderedList" title="목록">• 목록</button>
    <span class="div"></span>
    <button type="button" data-cmd="undo" title="실행취소">↶</button>
    <button type="button" data-cmd="redo" title="다시실행">↷</button>
    <span class="hint">편집 내용은 이 브라우저에 자동 저장됩니다</span>
  </div>
</div>

<div class="stage" id="stage">
  <p class="statusline" id="status"><span class="dot"></span><span id="statusText">보고서 불러오는 중…</span></p>
  <div class="paper" id="editor" contenteditable="true" spellcheck="false" hidden></div>
  <div class="empty" id="empty" hidden>
    <h2>보고서 내용이 없습니다</h2>
    <p>빌더에서 기기 특성을 선택한 뒤 <b>“평가 보고서 생성”</b>을 눌러 이 페이지를 여세요.</p>
    <p><a href="index.html">← 방법론 빌더로 이동</a></p>
  </div>
</div>

<script>
/* ---------- load content ---------- */
const editor=document.getElementById('editor');
const empty=document.getElementById('empty');
const statusText=document.getElementById('statusText');
let reportTitle='평가보고서';

function loadContent(){
  let body=null,title=null;
  try{body=localStorage.getItem('mp-report');title=localStorage.getItem('mp-report-title');}catch(e){}
  if(!body){ try{ if(window.opener&&window.opener.MP_REPORT){body=window.opener.MP_REPORT.body;title=window.opener.MP_REPORT.title;} }catch(e){} }
  if(!body){ editor.hidden=true; document.getElementById('status').hidden=true; empty.hidden=false; return; }
  if(title) reportTitle=title;
  editor.innerHTML=body; editor.hidden=false; empty.hidden=true;
  statusText.textContent=`${reportTitle} · 편집 가능`;
}
/* autosave edits back to localStorage */
let saveTimer=null;
editor.addEventListener('input',()=>{
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{localStorage.setItem('mp-report',editor.innerHTML);}catch(e){}
    statusText.textContent=`${reportTitle} · 저장됨 ✓`; },500);
});

/* ---------- formatting toolbar ---------- */
document.getElementById('fmtBar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const cmd=b.dataset.cmd, val=b.dataset.val;
  editor.focus();
  try{ document.execCommand(cmd,false,val); }catch(err){}
});

/* ---------- navigation / theme ---------- */
document.getElementById('homeBtn').addEventListener('click',()=>{ location.href='index.html'; });
const tb=document.getElementById('themeBtn');
let theme=null; try{theme=localStorage.getItem('mp-theme');}catch(e){}
if(theme)document.documentElement.setAttribute('data-theme',theme);
tb.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  const next=(cur==='dark'||(!cur&&sysDark))?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('mp-theme',next);}catch(e){}
});

/* ---------- print document CSS (shared by PDF) ---------- */
const PRINT_CSS=`@page{size:A4;margin:18mm}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Nanum Gothic',system-ui,sans-serif;color:#1a1a1a;font-size:11pt;line-height:1.5;margin:0}
h1{font-size:19pt;margin:0 0 6pt;color:#0a3d44;border-bottom:2pt solid #0b7c8b;padding-bottom:6pt}
h2{font-size:13pt;margin:16pt 0 6pt;color:#0b7c8b;border-bottom:0.5pt solid #cdd7db;padding-bottom:3pt}
h3{font-size:11.5pt;margin:11pt 0 3pt;color:#17323a;page-break-after:avoid}
p{margin:0 0 6pt}
p.meta{color:#555;font-size:10pt;margin:0 0 2pt}
p.why{color:#555;margin:0 0 4pt}
p.sig{margin-top:22pt;color:#333}
ul{margin:0 0 8pt;padding-left:16pt}
li{margin:0 0 5pt;page-break-inside:avoid}
code{font-family:Consolas,'D2Coding','Courier New',monospace;background:#f1f3f4;color:#0a3d44;padding:1pt 4pt;border-radius:3px;font-size:9.5pt}`;

/* ---------- PDF (browser print → Save as PDF) ---------- */
document.getElementById('pdfBtn').addEventListener('click',()=>{
  if(editor.hidden)return;
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${reportTitle}</title><style>${PRINT_CSS}</style></head><body>${editor.innerHTML}</body></html>`;
  const old=document.getElementById('pf'); if(old)old.remove();
  const f=document.createElement('iframe'); f.id='pf';
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  f.onload=function(){ try{f.contentWindow.focus();f.contentWindow.print();}catch(e){} setTimeout(()=>f.remove(),1500); };
  document.body.appendChild(f);
  const d=f.contentWindow.document; d.open(); d.write(html); d.close();
});

/* ---------- DOCX (edited HTML → OOXML, zero dependencies) ---------- */
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function docRun(text,o){
  o=o||{}; let rpr='<w:rPr>';
  if(o.bold)rpr+='<w:b/>'; if(o.italic)rpr+='<w:i/>';
  if(o.font)rpr+=`<w:rFonts w:ascii="${o.font}" w:hAnsi="${o.font}" w:cs="${o.font}"/>`;
  if(o.size)rpr+=`<w:sz w:val="${o.size}"/><w:szCs w:val="${o.size}"/>`;
  if(o.color)rpr+=`<w:color w:val="${o.color}"/>`;
  rpr+='</w:rPr>';
  return `<w:r>${rpr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
}
function docP(runs,o){
  o=o||{};
  const ppr=`<w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after!=null?o.after:120}"/>`+(o.ind?`<w:ind w:left="${o.ind}"/>`:'')+'</w:pPr>';
  return `<w:p>${ppr}${runs||''}</w:p>`;
}
function inlineRuns(node,style){
  let out='';
  node.childNodes.forEach(c=>{
    if(c.nodeType===3){ if(c.nodeValue) out+=docRun(c.nodeValue,style); }
    else if(c.nodeType===1){
      const t=c.tagName; const s=Object.assign({},style);
      if(t==='BR'){ out+='<w:r><w:br/></w:r>'; return; }
      if(t==='B'||t==='STRONG') s.bold=true;
      if(t==='I'||t==='EM') s.italic=true;
      if(t==='CODE'){ s.font='Consolas'; s.color='555555'; }
      out+=inlineRuns(c,s);
    }
  });
  return out;
}
function blockToXml(node){
  if(node.nodeType===3){ const t=node.nodeValue.trim(); return t?docP(docRun(t,{size:22})):''; }
  if(node.nodeType!==1) return '';
  const tag=node.tagName;
  switch(tag){
    case 'H1': return docP(inlineRuns(node,{bold:true,size:36}),{after:160});
    case 'H2': return docP(inlineRuns(node,{bold:true,size:28,color:'0C7D8C'}),{before:160,after:80});
    case 'H3': return docP(inlineRuns(node,{bold:true,size:24}),{before:120,after:40});
    case 'P':  return docP(inlineRuns(node,{size:22}),{after:120});
    case 'PRE':return docP(inlineRuns(node,{font:'Consolas',size:20,color:'555555'}),{after:120});
    case 'UL': case 'OL': {
      let x=''; node.childNodes.forEach(li=>{ if(li.nodeType===1&&li.tagName==='LI'){
        x+=docP(docRun('• ',{size:22})+inlineRuns(li,{size:22}),{ind:360,after:20}); } });
      return x;
    }
    case 'LI': return docP(docRun('• ',{size:22})+inlineRuns(node,{size:22}),{ind:360,after:20});
    case 'DIV': {
      const hasBlock=[...node.childNodes].some(c=>c.nodeType===1&&['H1','H2','H3','P','UL','OL','DIV','PRE','LI'].includes(c.tagName));
      if(hasBlock){ let x=''; node.childNodes.forEach(c=>{x+=blockToXml(c);}); return x; }
      return docP(inlineRuns(node,{size:22}),{after:120});
    }
    default: { let x=''; node.childNodes.forEach(c=>{x+=blockToXml(c);}); return x; }
  }
}
function crc32(bytes){
  let c,crc=0xFFFFFFFF;
  if(!crc32.t){const t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}crc32.t=t;}
  const t=crc32.t;
  for(let i=0;i<bytes.length;i++)crc=t[(crc^bytes[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  const chunks=[],central=[];let offset=0;
  files.forEach(f=>{
    const name=f.name,data=f.data,crc=crc32(data);
    const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    const la=new Uint8Array(lh.length+name.length+data.length);
    la.set(lh,0);la.set(name,lh.length);la.set(data,lh.length+name.length);
    chunks.push(la);
    const ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    const ca=new Uint8Array(ch.length+name.length);ca.set(ch,0);ca.set(name,ch.length);
    central.push(ca);offset+=la.length;
  });
  const cSize=central.reduce((a,c)=>a+c.length,0),cOff=offset;
  const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cSize),u32(cOff),u16(0)));
  const parts=chunks.concat(central,[end]);
  const total=parts.reduce((a,c)=>a+c.length,0),out=new Uint8Array(total);
  let p=0;parts.forEach(c=>{out.set(c,p);p+=c.length;});
  return out;
}
document.getElementById('docxBtn').addEventListener('click',()=>{
  if(editor.hidden)return;
  const btn=document.getElementById('docxBtn');
  try{
    const enc=new TextEncoder();
    let bodyXml=''; editor.childNodes.forEach(n=>{ bodyXml+=blockToXml(n); });
    const CT='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
    const RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
    const DOC='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+bodyXml+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>';
    const zip=makeZip([
      {name:enc.encode('[Content_Types].xml'),data:enc.encode(CT)},
      {name:enc.encode('_rels/.rels'),data:enc.encode(RELS)},
      {name:enc.encode('word/document.xml'),data:enc.encode(DOC)}
    ]);
    const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=reportTitle+'.docx';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    const o=btn.textContent; btn.textContent='✓ 저장됨'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('done');},1800);
  }catch(e){ btn.textContent='오류'; console.error(e); }
});

loadContent();
</script>
</body>
</html>
